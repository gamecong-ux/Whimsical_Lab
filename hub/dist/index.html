<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090a">
  <meta name="description" content="Whimsical Lab — 小さなアイデアから生まれたWebアプリのコレクション。">
  <title>Whimsical Lab</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="apps.js" defer></script>
</head>
<body>
  <!-- 光のスクリーンの端をぼかすフィルター：輪郭の透明度をぼかして内側へ溶かし（core）、外側にも薄いにじみ（halo）を重ねる -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <filter id="screen-soft-edge" x="-18%" y="-25%" width="136%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="36" result="blurredAlpha"/>
      <feComponentTransfer in="blurredAlpha" result="edgeMask"><feFuncA type="linear" slope="1.35" intercept="-0.2"/></feComponentTransfer>
      <feComposite in="SourceGraphic" in2="edgeMask" operator="in" result="core"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" result="haloBlur"/>
      <feComponentTransfer in="haloBlur" result="halo"><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="core"/></feMerge>
    </filter>
  </svg>
  <main class="home">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Whimsical Lab ホーム">Whimsical Lab</a>
      <span id="counter" class="header-counter" aria-live="polite"></span>
      <span class="edition">A LITTLE LAB, A LOT OF IDEAS.</span>
    </header>
    <section class="stage is-rotating" aria-label="作品を選ぶ">
      <div class="dial-area" aria-label="作品ダイヤル。画面全体のマウスホイールまたは円盤のドラッグで回転">
        <div class="dial-ring" aria-hidden="true"></div>
        <div id="dial-items" class="dial-items"></div>
      </div>
      <div class="light-art" aria-hidden="true"><svg id="light" class="light-svg" focusable="false"></svg><span class="prism"></span></div>
      <article class="detail" aria-labelledby="work-title">
        <div class="detail-top"><span id="work-kind" class="eyebrow"></span><span id="detail-number" class="detail-number"></span></div>
        <h1 id="work-title"></h1>
        <div class="screen" id="preview">
          <div class="screen-light" aria-hidden="true"></div>
          <div class="screen-content"><p id="work-description"></p><a id="open-app" class="open-app" href="#">アプリを開く <span aria-hidden="true">→</span></a></div>
        </div>
      </article>
    </section>
    <footer><span>Whimsical Lab</span><span>MADE WITH CURIOSITY.</span></footer>
  </main>
</body>
</html>
